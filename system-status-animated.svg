<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<style>
  .bg{fill:#0d1117}.panel{fill:#0d1117;stroke:#30363d;stroke-width:1.2}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
  .title{font-size:18px;font-weight:700;fill:#e6edf3}.muted{font-size:13px;fill:#8b949e}
  .key{font-size:14px;fill:#58a6ff}.green{font-size:14px;fill:#3fb950}.text{font-size:14px;fill:#c9d1d9}
  .line{opacity:0;animation:show .25s forwards}.blink{animation:blink 1s steps(1,end) infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  .bar{transform-origin:left;animation:grow .9s ease-out forwards;transform:scaleX(0)}
  @keyframes show{to{opacity:1}} @keyframes blink{50%{opacity:0}}
  @keyframes pulse{50%{opacity:.35}} @keyframes grow{to{transform:scaleX(1)}}
</style>
<rect class="bg" width="1100" height="520" rx="8"/>
<rect class="panel" x="15" y="15" width="1070" height="490" rx="10"/>
