<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<style>
  .bg{fill:#0d1117}
  .border{fill:none;stroke:#30363d;stroke-width:1.2}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
  .ascii{font-size:8.4px;fill:#8b949e;white-space:pre}
  .title{font-size:17px;font-weight:700;fill:#e6edf3}
  .muted{font-size:13px;fill:#8b949e}
  .key{font-size:14px;fill:#3fb950}
  .val{font-size:14px;fill:#c9d1d9}
  .blue{font-size:14px;fill:#58a6ff}
  .bar{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}

  .build-line{
    opacity:0;
    animation-name:assemble;
    animation-duration:.18s;
    animation-timing-function:steps(2,end);
    animation-fill-mode:forwards;
  }
  @keyframes assemble{
    0%{opacity:0;transform:translateX(-4px)}
    55%{opacity:.55}
    100%{opacity:1;transform:translateX(0)}
  }

</style>
